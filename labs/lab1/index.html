<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Produce Inventory & HTTP Message Builder</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5 mb-5">
        <h1 class="mb-4">Produce Inventory & HTTP Message Builder</h1>
        <div class="card mb-5 shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="card-title m-0">Fetched Inventory Dataset</h3>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-4 mb-2">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search produce name...">
                    </div>
                    <div class="col-md-4 mb-2">
                        <select id="typeFilter" class="form-control">
                            <option value="">All Types</option>
                            <option value="Fruit">Fruit</option>
                            <option value="Vegetable">Vegetable</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <button id="sortBtn" class="btn btn-outline-secondary btn-block">Sort by Name: A-Z</button>
                    </div>
                </div>
                <div id="produceCatalog" class="row"></div>
            </div>
        </div>

        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Build HTTP Message</h3>
            <form id="addProduceForm">
                <div class="form-group">
                    <label for="httpMethod">HTTP Method:</label>
                    <select id="httpMethod" class="form-control">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="produceName">Produce Name:</label>
                    <input type="text" id="produceName" required class="form-control" placeholder="e.g., Apple">
                </div>
                
                <div class="form-group">
                    <label for="produceType">Produce Type:</label>
                    <input type="text" id="produceType" required class="form-control" placeholder="e.g., Fruit">
                </div>
                
                <div class="form-group">
                    <label for="produceColour">Produce Colour:</label>
                    <input type="text" id="produceColour" required class="form-control" placeholder="e.g., Red">
                </div>
                
                <button type="submit" class="btn btn-primary">Generate HTTP Message</button>
            </form>

            <div class="mt-4">
                <h4>Generated HTTP Message:</h4>
                <pre id="httpMessageOutput" class="bg-dark text-light p-3 rounded" style="min-height: 150px;">Fill out the form and click generate...</pre>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>

	 <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
